<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AI DeepStack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a2c"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ea8ff"/>
      <stop offset="100%" stop-color="#6bc0ff"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fd0d8"/>
      <stop offset="100%" stop-color="#5ad0e8"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2fd4b8"/>
      <stop offset="100%" stop-color="#3de0c5"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- stack -->
  <rect x="7" y="19" width="18" height="4" rx="1.5" fill="url(#bar3)"/>
  <rect x="8.5" y="13.5" width="15" height="4" rx="1.5" fill="url(#bar2)"/>
  <rect x="10" y="8" width="12" height="4" rx="1.5" fill="url(#bar1)"/>
  <!-- AI signal node -->
  <circle cx="23.2" cy="7.2" r="2" fill="#7ff5df"/>
  <circle cx="23.2" cy="7.2" r="3.2" fill="none" stroke="#7ff5df" stroke-opacity="0.35" stroke-width="1"/>
</svg>
